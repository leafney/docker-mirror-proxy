name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          GIT_BRANCH="${GITHUB_REF_NAME}"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S')"
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.GitBranch=${GIT_BRANCH}' -X 'main.GitCommit=${GIT_COMMIT}' -X 'main.BuildTime=${BUILD_TIME}'"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/dmp-linux-amd64 ./cmd/dmp
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/dmp-linux-arm64 ./cmd/dmp
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/dmp-darwin-arm64 ./cmd/dmp

      - name: Checksums
        run: |
          cd dist
          sha256sum dmp-* > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmp-binaries
          path: dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
